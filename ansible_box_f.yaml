---
- name: setup web
  hosts: web
  become: yes

  tasks:
  - name:
    apt:
     name: tomcat9
     state: present

  - name: Ensure tomcat9 service is started
    service:
     name: tomcat9
     state: started

- name: setup constr
  hosts: db
  become: yes

  tasks:
  - name:
    apt:
     name: default-jdk
     state: present

  tasks:
  - name:
    apt:
     name: maven
     state: present

  tasks:
  - name:
    apt:
     name: git
     state: present

  tasks:
  - name: Clone Git repository
    git:
     repo: https://github.com/boxfuse/boxfuse-sample-java-war-hello.git
     dest: /home/user1

  tasks:
  - name: build
    command: mvn package
    args:
     chdir: /home/user1/boxfuse-sample-java-war-hello/

  hosts: all
  become: yes
  tasks:
    - name: Copy local config file to remote server
      copy:
        src: /home/user1/boxfuse-sample-java-war-hello/hello-1.0.war
        dest: /var/lib/tomcat9/webapps/hello-1.0.war
