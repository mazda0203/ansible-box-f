---
- name: setup web
  hosts: web
  become: yes

  tasks:
  - name:
    apt:
     name: tomcat9
     state: present

  - name: Ensure tomcat9 service is started
    service:
     name: tomcat9
     state: started

- name: setup constr
  hosts: db
  become: yes

  tasks:
  - name:
    apt:
     name: default-jdk
     state: present

  - name:
    apt:
     name: maven
     state: present

  - name:
    apt:
     name: git
     state: present

  - name: Clone Git repository
    ansible.builtin.git:
     repo: https://github.com/boxfuse/boxfuse-sample-java-war-hello.git
     dest: /home/user1
     version: main
     force: yes
     update: yes

  - name: build
    ansible.builtin.command: mvn clean package
    args:
    chdir: /home/user1/boxfuse-sample-java-war-hello/

  - name: Copy file from constr to web
    hosts: web
  - name: Transfer file
    ansible.posix.synchronize:
     src: /home/user1/boxfuse-sample-java-war-hello/hello-1.0.war
     dest: /var/lib/tomcat9/webapps/hello-1.0.war
    delegate_to: web
    mode: push

  - name: Verify file on web
    file:
     path: /var/lib/tomcat9/webapps/hello-1.0.war
     state: exists
