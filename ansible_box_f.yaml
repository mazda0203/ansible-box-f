---
- name: setup web
  hosts: web
  become: yes

  tasks:
  - name:
    apt:
     name: tomcat9
     state: present

  - name: Ensure tomcat9 service is started
    service:
     name: tomcat9
     state: started

- name: setup constr
  hosts: db
  become: yes

  tasks:
  - name:
    apt:
     name: default-jdk
     state: present

  - name: Maven
    become: true
    apt:
      name: maven
      state: latest
      update_cache: yes

  tasks:
  - name:
    apt:
     name: git
     state: present

  tasks:
  - name: Clone Git repository
    git:
     repo: https://github.com/boxfuse/boxfuse-sample-java-war-hello.git
     dest: /home/user1/hello/

  tasks:
  - name: build
    command: mvn package
    args:
     chdir: /home/user1/hello/


- name: Fetch file from source host to controller
  hosts: db
  tasks:
   - name: Get file from remote to controller
     fetch:
       src: /home/user1/hello/target/hello-1.0.war
       dest: ./fetched_files/
       flat: yes

- name: Distribute file to target hosts
  hosts: web
  tasks:
   - name: Copy fetched file to targets
     copy:
      src: ./fetched_files/hello-1.0.war
      dest: /var/lib/tomcat9/webapps/hello-1.0.war
      mode: "0644"
